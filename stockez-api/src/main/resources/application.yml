server:
  port: ${PORT:8080}

spring:
  application:
    name: stockez-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockez}
    username: ${DB_USERNAME:stockez}
    password: ${DB_PASSWORD:stockez123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
        default_schema: public

  cache:
    type: ${CACHE_TYPE:redis}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

# StockEz Custom Properties
stockez:
  super-admin:
    phone: ${SUPER_ADMIN_PHONE:9384745303}
    password: ${SUPER_ADMIN_PASSWORD:Stockez@321}
  security:
    jwt:
      secret: ${JWT_SECRET:YourSuperSecretKeyForStockEzPlatformMinimum256BitRequiredForHS512AlgorithmChangeInProduction2025}
      access-token-expiry-ms: 28800000      # 8 hours
      refresh-token-expiry-ms: 2592000000  # 30 days

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    root: INFO
    com.stockez: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Sentry — error tracking
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:production}
  traces-sample-rate: 0.1
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# Log file path (override with LOG_PATH env var in production) + file storage
app:
  log:
    path: ${LOG_PATH:./logs}
  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
    base-url: ${BASE_URL:http://localhost:8080}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:stockez-images}
      public-url: ${R2_PUBLIC_URL:}
