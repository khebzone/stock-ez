server {
    server_name stockez.in www.stockez.in;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /opt/stockez/uploads/;
    }

    location /assets/ {
        root /var/www/stockez;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /var/www/stockez;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /var/www/stockez;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stockez.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockez.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name *.stockez.in;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /opt/stockez/uploads/;
    }

    location /assets/ {
        root /var/www/stockez;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /var/www/stockez;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /var/www/stockez;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stockez.in-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockez.in-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name stockez.in www.stockez.in *.stockez.in;
    return 301 https://$host$request_uri;
}
