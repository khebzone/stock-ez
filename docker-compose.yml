version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stockez-postgres
    restart: always
    environment:
      POSTGRES_DB: stockez
      POSTGRES_USER: stockez
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockez123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockez -d stockez"]
      interval: 10s
      timeout: 5s
      retries: 5

  stockez-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockez-api
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/stockez
      DB_USERNAME: stockez
      DB_PASSWORD: ${DB_PASSWORD:-stockez123}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForStockEzPlatformMinimum256BitRequiredForHS512AlgorithmChangeInProduction2025}
      UPLOAD_DIR: /app/uploads
      BASE_URL: ${BASE_URL:-http://localhost}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  stockez-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: stockez-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - stockez-api

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
