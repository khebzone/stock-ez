# StockEz production nginx — HTTPS with Cloudflare Origin Certificate.
# Place your Cloudflare Origin cert at deploy/certs/origin.pem and key at
# deploy/certs/origin.key (see the runbook).

# NOTE: the Cloudflare set_real_ip_from / real_ip_header CF-Connecting-IP block
# that used to live here has been REMOVED. DNS is at Hostinger and traffic hits
# this origin directly, so nothing arrives via Cloudflare's proxy. Trusting
# CF-Connecting-IP from those ranges let anyone routing through a Cloudflare IP
# spoof their source address — which would have defeated the fail2ban
# stockez-login jail, since that jail bans whatever IP nginx writes to the log.
# If the domain is ever moved behind Cloudflare's proxy, restore it.

# Brute-force throttle for the login endpoint. Generous enough for a whole
# office behind one NAT address at 9am; useless for a password sprayer.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server_tokens off;

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # access log to a host-mounted file so fail2ban can watch login brute-force
    access_log /var/log/nginx/access.log main;        # keeps docker-logs visibility
    access_log /var/log/nginx/host/access.log main;   # file for fail2ban

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;
    root /usr/share/nginx/html;
    index index.html;

    # Throttled separately from the rest of the API. burst+nodelay so a normal
    # morning login rush passes straight through; a sprayer gets 429s.
    location = /api/v1/auth/login {
        limit_req zone=login burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://stockez-api:8080/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://stockez-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # index.html must NEVER be cached. Every frontend build emits new hashed asset
    # filenames; a browser holding a stale index.html requests files that no longer
    # exist and dies with "Failed to fetch dynamically imported module".
    # add_header stops inheriting once redefined in a location, so the security
    # headers are repeated in each block below deliberately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Hashed assets are immutable — the filename changes whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
