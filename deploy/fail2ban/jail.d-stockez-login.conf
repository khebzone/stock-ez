# /etc/fail2ban/jail.d/stockez-login.conf
# Brute-force protection for the StockEz web login.
#
# Two non-obvious requirements on this stack:
#   1. backend = polling  -> Ubuntu 24.04 defaults fail2ban to the systemd
#      journal backend, which IGNORES logpath. Must force file polling.
#   2. chain = DOCKER-USER -> the app runs in Docker; a normal INPUT-chain
#      ban does NOT block traffic to published container ports. Bans must go
#      into DOCKER-USER (which Docker consults for container-bound traffic).
#
# nginx must access_log to /opt/stockez/deploy/nginx-logs/access.log
# (mounted from the stockez-web container — see docker-compose.prod.yml).
[stockez-login]
backend  = polling
enabled  = true
filter   = stockez-login
logpath  = /opt/stockez/deploy/nginx-logs/access.log
maxretry = 6
findtime = 5m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
action   = iptables-allports[name=stockez-login, chain="DOCKER-USER"]
