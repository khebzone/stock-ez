name: stockez

# Hardened production stack.
# SECURITY: postgres and redis have NO host ports -> they are ONLY reachable
# from inside the docker network, never from the internet. This is the single
# most important change vs. the old setup.

services:
  postgres:
    image: postgres:15-alpine
    container_name: stockez-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-stockez}
      POSTGRES_USER: ${DB_USERNAME:-stockez}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]           # internal only - NOT exposed to host/internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stockez} -d ${DB_NAME:-stockez}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockez-redis
    restart: always
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]           # internal only - the network isolation is the protection
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stockez-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: stockez-api
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-stockez}
      DB_USERNAME: ${DB_USERNAME:-stockez}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:?required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET:-stockez-images}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      BASE_URL: ${BASE_URL}
      UPLOAD_DIR: /app/uploads
      LOG_PATH: /app/logs
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Auto-delete of unreferenced R2 images (2 AM). Off while rebuilding data.
      ORPHAN_CLEANUP_ENABLED: ${ORPHAN_CLEANUP_ENABLED:-true}
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  stockez-web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    container_name: stockez-web
    restart: always
    ports:
      - "80:80"        # public HTTP (Cloudflare proxies to this; redirects to 443)
      - "443:443"      # public HTTPS (Cloudflare Origin Certificate)
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./nginx-logs:/var/log/nginx/host
    networks: [internal]
    depends_on: [stockez-api]

networks:
  internal:
    driver: bridge

volumes:
  pgdata: { driver: local }
  redisdata: { driver: local }
  uploads: { driver: local }
