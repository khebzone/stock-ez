server:
  port: 8080

spring:
  application:
    name: distroiq-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/distroiq}
    username: ${DB_USERNAME:distroiq}
    password: ${DB_PASSWORD:distroiq123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

# DistroIQ Custom Properties
distroiq:
  security:
    jwt:
      secret: ${JWT_SECRET:YourSuperSecretKeyForDistroIQPlatformMinimum256BitRequiredForHS512AlgorithmChangeInProduction2025}
      access-token-expiry-ms: 28800000      # 8 hours
      refresh-token-expiry-ms: 2592000000  # 30 days

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    root: INFO
    com.distroiq: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

# File storage
app:
  upload:
    dir: ${UPLOAD_DIR:C:/Users/Kathiravan/Desktop/distroiq/uploads}
    base-url: ${BASE_URL:http://localhost:8080}
