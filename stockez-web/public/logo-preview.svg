<?xml version="1.0" encoding="UTF-8"?>
<!--
  StockEz Logo Preview
  Open this file in a browser or VSCode SVG preview to see the design.
  Three sections shown: Full horizontal logo, Icon-only (sidebar), Dark background version
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">

  <!-- ─── Background ─── -->
  <rect width="480" height="260" fill="#f0fdf4"/>

  <!-- ─── Label: Full Logo ─── -->
  <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">FULL LOGO</text>

  <!-- ════════════════════════════════════════════
       DESIGN 1 — Full horizontal logo (light bg)
       ════════════════════════════════════════════ -->
  <g transform="translate(20, 35)">

    <!-- Icon background: rounded square, gradient green -->
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    </defs>
    <rect width="56" height="56" rx="14" fill="url(#g1)"/>

    <!-- ── Icon Mark: 3 inventory shelf bars + upward arrow ── -->

    <!-- Bar 1 (top, full width) -->
    <rect x="10" y="12" width="36" height="8" rx="4" fill="white"/>

    <!-- Bar 2 (middle, shorter — leaves gap on right for arrow) -->
    <rect x="10" y="24" width="26" height="8" rx="4" fill="white"/>

    <!-- Bar 3 (bottom, full width) -->
    <rect x="10" y="36" width="36" height="8" rx="4" fill="white"/>

    <!-- Upward arrow in the right gap (between bar 1 right edge and bar 2/3 gap) -->
    <!-- Vertical stem -->
    <line x1="41" y1="43" x2="41" y2="21"
      stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <!-- Arrowhead -->
    <polyline points="37,27 41,20 45,27"
      stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      fill="none" opacity="0.75"/>

    <!-- Wordmark -->
    <text x="72" y="37"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="28" font-weight="800" letter-spacing="-1"
      fill="#064e3b">Stock</text>
    <text x="180" y="37"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="28" font-weight="800" letter-spacing="-1"
      fill="#059669">Ez</text>

    <!-- Tagline -->
    <text x="73" y="52"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="10" font-weight="500" letter-spacing="1.2"
      fill="#047857" opacity="0.55">DISTRIBUTION PLATFORM</text>

  </g>

  <!-- ─── Divider ─── -->
  <line x1="20" y1="110" x2="460" y2="110" stroke="#d1fae5" stroke-width="1"/>

  <!-- ─── Label: Sidebar states ─── -->
  <text x="20" y="128" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SIDEBAR — EXPANDED &amp; COLLAPSED</text>

  <!-- ════════════════════════════════════════════
       DESIGN 2 — Sidebar expanded (dark bg)
       ════════════════════════════════════════════ -->
  <g transform="translate(20, 140)">

    <!-- Dark sidebar panel -->
    <rect width="200" height="64" rx="10" fill="#064e3b"/>

    <!-- Icon (32×32) -->
    <defs>
      <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    </defs>
    <rect x="14" y="16" width="32" height="32" rx="8" fill="url(#g2)"/>

    <!-- Bars (scaled down for 32px icon) -->
    <rect x="20" y="21" width="20" height="4" rx="2" fill="white"/>
    <rect x="20" y="28" width="14" height="4" rx="2" fill="white"/>
    <rect x="20" y="35" width="20" height="4" rx="2" fill="white"/>
    <!-- Arrow -->
    <line x1="37" y1="39" x2="37" y2="24"
      stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <polyline points="34.5,27 37,23 39.5,27"
      stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
      fill="none" opacity="0.7"/>

    <!-- Company name -->
    <text x="56" y="31"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="16" font-weight="800" letter-spacing="-0.5"
      fill="white">StockEz</text>
    <text x="57" y="44"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="9" font-weight="500" letter-spacing="0.5"
      fill="white" opacity="0.4">Distribution Platform</text>

  </g>

  <!-- ════════════════════════════════════════════
       DESIGN 3 — Sidebar collapsed (icon only)
       ════════════════════════════════════════════ -->
  <g transform="translate(240, 140)">

    <!-- Dark sidebar panel (narrow) -->
    <rect width="68" height="64" rx="10" fill="#064e3b"/>

    <!-- Icon (32×32) centered -->
    <defs>
      <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    </defs>
    <rect x="18" y="16" width="32" height="32" rx="8" fill="url(#g3)"/>

    <!-- Bars (scaled down for 32px icon) -->
    <rect x="24" y="21" width="20" height="4" rx="2" fill="white"/>
    <rect x="24" y="28" width="14" height="4" rx="2" fill="white"/>
    <rect x="24" y="35" width="20" height="4" rx="2" fill="white"/>
    <!-- Arrow -->
    <line x1="41" y1="39" x2="41" y2="24"
      stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <polyline points="38.5,27 41,23 43.5,27"
      stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
      fill="none" opacity="0.7"/>

  </g>

  <!-- ─── Divider ─── -->
  <line x1="20" y1="218" x2="460" y2="218" stroke="#d1fae5" stroke-width="1"/>

  <!-- ─── Label: Icon only standalone ─── -->
  <text x="20" y="236" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">ICON MARK — LARGE</text>

  <!-- Large icon standalone -->
  <g transform="translate(20, 240)">
    <defs>
      <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    </defs>
    <rect width="16" height="16" rx="4" fill="url(#g4)"/>
    <rect x="2" y="3" width="12" height="3" rx="1.5" fill="white"/>
    <rect x="2" y="7" width="8" height="3" rx="1.5" fill="white"/>
    <rect x="2" y="11" width="12" height="3" rx="1.5" fill="white"/>
  </g>

</svg>
